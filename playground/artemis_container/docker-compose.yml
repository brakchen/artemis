version: '3.8'

services:
  artemis-session:
    build:
      context: ../..
      dockerfile: playground/artemis_container/Dockerfile
      args:
        ARTEMIS_BASE_IMAGE: ${ARTEMIS_BASE_IMAGE:-artemis-runtime:latest}
    container_name: artemis-session-sample
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SESSION_ID=sample-session-123
      - ADB_DEVICE_SERIAL=host.docker.internal:6520
      - PORT=8080
      - PYTHONUNBUFFERED=1
      - ARTEMIS_ARTEMIS_JSONC=/run/artemis/artemis.jsonc
      - ARTEMIS_APP_DIR=/var/lib/artemis
      - ARTEMIS_CONFIG_READ_ONLY=1
    volumes:
      - ${ARTEMIS_MAIN_CONFIG:?Set selected main config file}:/run/artemis/artemis.jsonc:ro
      - ${ARTEMIS_PROVIDER_REGISTRY:?Set selected provider registry file}:/var/lib/artemis/llm_providers.json:ro
      - ${ARTEMIS_SELECTED_ENV_FILE:?Set selected legacy dotenv file}:/var/lib/artemis/.env:ro
    networks:
      - artemis-net
    extra_hosts:
      # Allows reaching Cuttlefish emulator running on the COS VM host network
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/system/health"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  artemis-net:
    name: artemis-net
    driver: bridge
